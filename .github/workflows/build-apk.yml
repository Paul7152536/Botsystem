name: Build APK from ZIP

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Extract ZIP File
      run: |
        if [ -f "eatadventure-bot-complete.zip" ]; then
          echo "📦 ZIP gefunden - wird entpackt..."
          unzip -o eatadventure-bot-complete.zip
