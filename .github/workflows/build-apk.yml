name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Extract ZIP if present
      run: |
        echo "Looking for ZIP files..."
        for z in *.zip; do
          if [ -f "$z" ]; then
            echo "Found ZIP: $z"
            echo "Extracting $z..."
            unzip -oq "$z"
            echo "Extract complete"
          fi
        done
        echo "Files in current directory:"
        ls -la
        echo "Checking for build files..."
        [ -f "build.gradle.kts" ] && echo "✓ build.gradle.kts found" || echo "✗ build.gradle.kts NOT found"
        [ -d "app" ] && echo "✓ app/ directory found" || echo "✗ app/ directory NOT found"

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin

    - name: Build with Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: 8.7
        arguments: assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: app/build/outputs/apk/debug/app-debug.apk
